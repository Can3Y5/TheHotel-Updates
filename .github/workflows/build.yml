name: Build Android APK and Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Java JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android Gradle Projesini Oluştur ve APK Derle
        run: |
          mkdir -p android-app/app/src/main/java/com/oteloyunu/app
          mkdir -p android-app/app/src/main/assets
          cp index.html android-app/app/src/main/assets/index.html

          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android-app/app/src/main/res/$dir
            cp icon.png android-app/app/src/main/res/$dir/ic_launcher.png
            cp icon_round.png android-app/app/src/main/res/$dir/ic_launcher_round.png
          done

          cat << 'EOF' > android-app/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OtelOyunu"
          include ':app'
          EOF

          cat << 'EOF' > android-app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.oteloyunu.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.oteloyunu.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 12
                  versionName "1.9.1"
              }
              buildTypes {
                  debug {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="TheHotel Game"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-app/app/src/main/java/com/oteloyunu/app/MainActivity.java
          package com.oteloyunu.app;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.media.AudioAttributes;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.net.Uri;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.HashMap;
          import java.util.Map;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private static final int BUILTIN_VERSION = 12;
              private static final String PREFS_NAME = "thehotel_updater_prefs";
              private static final String KEY_VER = "installed_version";
              private static final String KEY_VER_NAME = "installed_version_name";
              private static final String KEY_SAVE_DATA = "saved_game_json";
              private static final String UPDATE_FILE = "game_update.html";

              private WebView webView;
              private final Map<String, short[]> soundBank = new HashMap<>();
              private final ExecutorService audioPool = Executors.newCachedThreadPool();

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setVolumeControlStream(AudioManager.STREAM_MUSIC);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  initNativeSounds();

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setAllowFileAccessFromFileURLs(true);
                  settings.setAllowUniversalAccessFromFileURLs(true);
                  settings.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.addJavascriptInterface(new AndroidUpdater(this), "AndroidUpdater");
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);

                  loadCurrentGame();
              }

              private short[] synthPcm(double[] freqs, double step, double noteLen, double decay, double vol) {
                  int rate = 44100;
                  double total = step * (freqs.length - 1) + noteLen;
                  int n = (int) Math.ceil(total * rate);
                  double[] buf = new double[n];
                  int len = (int) Math.round(noteLen * rate);
                  for (int i = 0; i < freqs.length; i++) {
                      int start = (int) Math.round(i * step * rate);
                      for (int s = 0; s < len && start + s < n; s++) {
                          double t = s / (double) rate;
                          double env = Math.exp(-t * decay) * Math.min(1.0, t / 0.005);
                          double v = Math.sin(2.0 * Math.PI * freqs[i] * t) + 0.35 * Math.sin(4.0 * Math.PI * freqs[i] * t);
                          buf[start + s] += v * env * vol;
                      }
                  }
                  short[] pcm = new short[n];
                  for (int i = 0; i < n; i++) {
                      double clamped = Math.max(-1.0, Math.min(1.0, buf[i]));
                      pcm[i] = (short) (clamped * 32767);
                  }
                  return pcm;
              }

              private void initNativeSounds() {
                  soundBank.put("open", synthPcm(new double[]{523.25, 659.25, 783.99, 1046.5}, 0.11, 0.8, 4.0, 0.35));
                  soundBank.put("close", synthPcm(new double[]{783.99, 659.25, 523.25, 392.0}, 0.16, 0.8, 4.0, 0.35));
                  soundBank.put("bell", synthPcm(new double[]{1318.5, 1760.0}, 0.1, 0.6, 6.0, 0.32));
                  soundBank.put("coin", synthPcm(new double[]{987.77, 1318.5}, 0.07, 0.3, 10.0, 0.30));
                  soundBank.put("build", synthPcm(new double[]{130.8, 98.0}, 0.12, 0.35, 9.0, 0.45));
                  soundBank.put("done", synthPcm(new double[]{523.25, 659.25, 783.99, 1046.5, 1318.5}, 0.09, 0.7, 5.0, 0.32));
                  soundBank.put("alarm", synthPcm(new double[]{233.0, 196.0, 233.0, 196.0}, 0.14, 0.3, 3.0, 0.40));
                  soundBank.put("tap", synthPcm(new double[]{660.0}, 0.04, 0.08, 22.0, 0.22));
                  soundBank.put("clean", synthPcm(new double[]{587.33, 783.99, 987.77}, 0.06, 0.22, 12.0, 0.28));
                  soundBank.put("reject", synthPcm(new double[]{196.0, 146.83}, 0.12, 0.28, 8.0, 0.34));
                  soundBank.put("place", synthPcm(new double[]{440.0, 554.37, 659.25}, 0.07, 0.3, 8.0, 0.30));
              }

              private void playNativePcm(final String name) {
                  final short[] pcm = soundBank.get(name);
                  if (pcm == null) return;
                  audioPool.execute(() -> {
                      try {
                          AudioTrack track = new AudioTrack.Builder()
                              .setAudioAttributes(new AudioAttributes.Builder()
                                  .setUsage(AudioAttributes.USAGE_GAME)
                                  .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                                  .build())
                              .setAudioFormat(new AudioFormat.Builder()
                                  .setEncoding(AudioFormat.ENCODING_PCM_16BIT)
                                  .setSampleRate(44100)
                                  .setChannelMask(AudioFormat.CHANNEL_OUT_MONO)
                                  .build())
                              .setBufferSizeInBytes(pcm.length * 2)
                              .setTransferMode(AudioTrack.MODE_STATIC)
                              .build();
                          track.write(pcm, 0, pcm.length);
                          track.play();
                          Thread.sleep((pcm.length * 1000L) / 44100L + 100L);
                          track.release();
                      } catch (Exception ignored) {}
                  });
              }

              private void loadCurrentGame() {
                  SharedPreferences prefs = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                  int installedVer = prefs.getInt(KEY_VER, BUILTIN_VERSION);
                  File updateFile = new File(getFilesDir(), UPDATE_FILE);

                  if (installedVer > BUILTIN_VERSION && updateFile.exists() && updateFile.length() > 100) {
                      webView.loadUrl(updateFile.toURI().toString());
                  } else {
                      webView.loadUrl("file:///android_asset/index.html");
                  }
              }

              public class AndroidUpdater {
                  private final Context ctx;
                  AndroidUpdater(Context c) { this.ctx = c; }

                  @JavascriptInterface
                  public int getInstalledVersion() {
                      SharedPreferences prefs = ctx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                      File updateFile = new File(ctx.getFilesDir(), UPDATE_FILE);
                      int v = prefs.getInt(KEY_VER, BUILTIN_VERSION);
                      if (v > BUILTIN_VERSION && updateFile.exists()) return v;
                      return BUILTIN_VERSION;
                  }

                  @JavascriptInterface
                  public void playSound(final String name) {
                      playNativePcm(name);
                  }

                  @JavascriptInterface
                  public void saveGameData(final String json) {
                      try {
                          SharedPreferences prefs = ctx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                          prefs.edit().putString(KEY_SAVE_DATA, json != null ? json : "").apply();
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public String loadGameData() {
                      try {
                          SharedPreferences prefs = ctx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                          return prefs.getString(KEY_SAVE_DATA, "");
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public boolean applyUpdate(final String htmlContent, final int versionCode, final String versionName) {
                      try {
                          if (htmlContent == null || htmlContent.length() < 500 || !htmlContent.contains("<html")) {
                              return false;
                          }
                          File updateFile = new File(ctx.getFilesDir(), UPDATE_FILE);
                          try (FileOutputStream fos = new FileOutputStream(updateFile, false)) {
                              fos.write(htmlContent.getBytes(StandardCharsets.UTF_8));
                              fos.flush();
                          }
                          SharedPreferences prefs = ctx.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE);
                          prefs.edit()
                              .putInt(KEY_VER, versionCode)
                              .putString(KEY_VER_NAME, versionName)
                              .apply();

                          runOnUiThread(() -> {
                              Toast.makeText(ctx, "Güncelleme kuruldu: v" + versionName, Toast.LENGTH_LONG).show();
                              loadCurrentGame();
                          });
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
                  }

                  @JavascriptInterface
                  public void openExternalUrl(final String url) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          ctx.startActivity(intent);
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          cd android-app
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../OtelOyunu-Android.apk

      - name: APK Dosyasını Yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: OtelOyunu-Android-APK
          path: OtelOyunu-Android.apk

      - name: GitHub Releases Kısmına APK Yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.1
          name: "TheHotel Game - Güncel APK (v1.9.1)"
          body: "v1.9.1: Ana menüde '📜 Geçmiş' (Güncelleme Geçmişi / Sürüm Notları) penceresi, v1.9.0 Etkinlikler Sistemi (Ünlü Konuk & Koruma, Düğün, Festival) ve önceki tüm yenilikleri içeren güncel Android APK dosyası."
          files: OtelOyunu-Android.apk
          prerelease: false

  build-windows-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu İndir
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Electron ile Windows EXE Oluştur
        run: |
          mkdir -p win-app
          cp index.html win-app/index.html
          cp icon.png win-app/icon.png
          cat << 'EOF' > win-app/package.json
          {
            "name": "otel-oyunu",
            "version": "1.1.0",
            "main": "main.js"
          }
          EOF
          cat << 'EOF' > win-app/main.js
          const { app, BrowserWindow } = require('electron');
          const path = require('path');
          function createWindow() {
            const win = new BrowserWindow({
              width: 540,
              height: 960,
              icon: path.join(__dirname, 'icon.png'),
              autoHideMenuBar: true,
              title: "TheHotel Game"
            });
            win.loadFile('index.html');
          }
          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => app.quit());
          EOF
          cd win-app
          npm install --save-dev electron @electron/packager
          npx electron-packager . OtelOyunu --platform=win32 --arch=x64 --out=../dist

      - name: Windows EXE Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: OtelOyunu-Windows-EXE
          path: dist/OtelOyunu-win32-x64/
